services:
  - type: web
    name: k2-inbound-call-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: "EXAVITQu4vr4xnSDxMaL"   # default Sarah voice — override if desired
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SERVER_URL
        sync: false          # set this to your Render URL after first deploy
      - key: VALIDATE_TWILIO_SIGNATURE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
