intro_prompt: |
  You have already explained the K2 offsite vibe-coding demo context in your opening.
  Now transition naturally into the questions below — your goal is to draw out real,
  specific problem ideas this person thinks would be worth building.
  Don't interrogate; have a genuine conversation. Follow the thread when they share
  something interesting. If they answer multiple questions at once, acknowledge it and move on.

questions:
  - id: problem_space
    text: "What's a problem you run into — or see others dealing with — that feels like it should be easier than it is?"
    variable_name: problem_space
    required: true

  - id: who_feels_it
    text: "Who feels that pain the most — is it something specific to your team, your industry, or more universal?"
    variable_name: who_feels_it
    required: true

  - id: current_workaround
    text: "How do people deal with it today — is there a workaround, or do they just live with it?"
    variable_name: current_workaround
    required: false

  - id: demo_appeal
    text: "If we built something that solved that in a live demo, what would make it feel impressive and real — not just a toy?"
    variable_name: demo_appeal
    required: true

  - id: scope_gut_check
    text: "What's your gut on scope — does something meaningful feel buildable in a day or two, or is it inherently complex?"
    variable_name: scope_gut_check
    required: false

  - id: other_ideas
    text: "Any other problems that came to mind — even rough ones?"
    variable_name: other_ideas
    required: false
